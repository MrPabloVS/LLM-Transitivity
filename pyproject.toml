[project]
name = "llm-transitivity"
version = "0.1.0"
description = "Hypothetical syllogism benchmarks for language models"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "inspect-ai>=0.3.286",
    "inspect-flow>=0.14.0",
    "markdown>=3.11.2",
    "matplotlib>=3.11.2",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
transitivity = "llm_transitivity.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
